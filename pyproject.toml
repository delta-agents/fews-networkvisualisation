[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "fewsvisualiser/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fewsvisualiser"]

[project]
name = "fewsvisualiser"
authors = [
  { name = "Job Verkaik",
  { name = "Mattijn van Hoek"},
  { name = "David Haasnoot"},
}]
dependencies = ["fire"]
description = "FEWSVisualiser: Insights for optimized Delft-FEWS configurations."
readme = "README.md"
keywords = ["delft-fews", "declarative", "configuration", "insight"]
requires-python = ">=3.8"
license = {text = "GNU-GPL V3"}
dynamic = ["version"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License"
]

[project.urls]
Source = "https://github.com/delta-agents/fews-networkvisualisation"