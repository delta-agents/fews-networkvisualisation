[project]
name = "talkwithfews"
version = "0.1.0"
description = "TalkWithFews project"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]

[dependencies]
python = ">=3.11"
python-dotenv = ">=1.0.1"
openai = ">=1.12.0"
pydantic = ">=2.0.0"
pydantic-ai = "*"
streamlit = ">=1.32.0"
pytest = ">=8.0.2"
pytest-asyncio = ">=0.25.0"

[pypi-dependencies]
streamlit_markdown = ">=1.1.0"

[tasks]
test = "pytest"
start = { cmd = "streamlit run app/streamlit_app.py" } 
docker = { cmd = "streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0" } 