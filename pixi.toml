[project]
name = "talkwithfews"
version = "0.1.0"
description = "TalkWithFews project"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]

[dependencies]
python = ">=3.11"
python-dotenv = ">=1.0.1"
openai = ">=1.12.0"
pydantic = ">=2.0.0"
pydantic-ai = "*"
streamlit = ">=1.32.0"
pytest = ">=8.0.2"
ipykernel = "*"
pandas = "*"
pip = "*"
openpyxl = "*"
pytest-asyncio = ">=0.25.0"
fire = ">=0.7.0,<0.8"

[pypi-dependencies]
streamlit_markdown = ">=1.1.0"
fewsvisualiser = { path = ".", editable = true }

[tasks]
test = "pytest"
start = { cmd = "streamlit run app/streamlit_app.py" } 
docker = { cmd = "streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0" } 
analyse_config = "python fewsvisualiser\\__main__.py analyse_config"
explore_config = "python fewsvisualiser\\__main__.py explore_config"
locset_analysis = "python fewsvisualiser\\__main__.py locset_analysis"
