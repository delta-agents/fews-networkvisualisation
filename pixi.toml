[project]
name = "talkwithfews"
version = "0.1.0"
description = "TalkWithFews project"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]

[dependencies]
python = ">=3.11"
pytest = ">=8.0.2"

[pypi-dependencies]
fewsvisualiser = { path = ".", editable = true }

[tasks]
test = "pytest"
start = { cmd = "streamlit run app/streamlit_app.py" } 
docker = { cmd = "streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0" } 
